services:
  timescaledb:
    ports:
      - "5432:5432"
  rabbitmq:
    ports:
      - "5672:5672"    # AMQP 端口
      - "15672:15672"  # Web管理界面端口
      - "1883:1883"    # MQTT 端口
    extra_hosts:
      - "host.docker.internal:host-gateway"
  nginx:
    depends_on:
      timescaledb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  mediamtx:
    ports:
      - "8554:8554"    # RTSP 端口
      - "1935:1935"    # RTMP 端口
      - "8888:8888"    # HLS 端口
      - "8889:8889"    # WebRTC 端口
      - "9997:9997"    # API 端口
      - "8000:8000/udp" # RTP UDP 端口
      - "8001:8001/udp" # RTCP UDP 端口
      - "8890:8890/udp" # SRT UDP 端口
      - "8189:8189/udp" # WebRTC UDP 端口
